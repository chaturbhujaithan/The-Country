<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Country</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>
</head>

<body class="bg-teal-100 text-gray-900 dark:bg-gray-900 dark:text-white">

  <header class="bg-[#23698f] fixed top-0 left-0 z-50 w-full dark:bg-gray-800 shadow">
    <div class="max-w-7xl mx-auto px-5 py-5 flex items-center">
        <span ><img src="https://cdn-icons-png.flaticon.com/512/20/20087.png" class="w-[30px] h-[30px] rounded-[50px] " alt=""></span>
      <h1 class="text-xl md:text-2xl font-bold ml-[10px]">The Country</h1>

      <button id="themeBtn" class="font-semibold ml-[930px]">
        🌙 Dark Mode
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto mt-[30px] p-5">

    <section id="homePage">

      <div class="flex flex-col md:flex-row gap-4 justify-between my-8">

        <input
          id="searchInput"
          type="text"
          placeholder=" Search for a country..."
          class="p-4 rounded-lg shadow bg-pink-100 w-full md:w-80 dark:bg-gray-800 outline-none"
        >

        <select
          id="regionFilter"
          class="p-4 rounded-lg shadow bg-pink-100 dark:bg-gray-800 outline-none"
        >
          <option value="">Filter by Region</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>

      </div>
      <p id="status" class="mb-5 text-gray-500 whitespace-nowrap">Loading countries...</p>
      <div id="countryContainer"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      </div>
    </section>
    <section id="detailPage" class="hidden mt-8">
     <div class="flex gap-4 mb-10">
  <button id="backBtn" class="bg-white dark:bg-gray-800 shadow px-6 py-2 rounded">
    ← Back
  </button>
  <button id="favoriteBtn"
    class="bg-teal-400 text-black shadow px-6 py-2 rounded hover:bg-teal-500">
    Add Favorite
  </button>
</div>
      <div id="countryDetails"
        class="grid md:grid-cols-2 border border-black gap-10 bg-blue-300 rounded-lg items-center">
      </div>
    </section>
  </main>
  <footer class="bg-[#23698f] mt-[50px] h-[120px] pt-[30px] w-full dark:bg-gray-800 shadow">
    <p class="w-full text-center text-white">@Copyright</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
